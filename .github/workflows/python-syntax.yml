name: EFDT tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install historical-script dependencies
        run: python -m pip install -r requirements.txt
      - name: Install reference implementation dependencies
        run: python -m pip install -r requirements-reference.txt
      - name: Install EFDT package
        run: python -m pip install -e .
      - name: Run experiment syntax and reference unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: python -m efdt --help
