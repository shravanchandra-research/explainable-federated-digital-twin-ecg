[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efdt-ptbxl-reference"
version = "0.1.0"
description = "Executable research implementation for multi-label PTB-XL ECG classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "h5py>=3.8", "scikit-learn>=1.3", "torch>=2.2"]

[project.scripts]
efdt = "efdt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
